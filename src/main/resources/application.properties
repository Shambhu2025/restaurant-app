spring.application.name=restaurant-app

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fast_food}
spring.datasource.username=${DB_USERNAME:fastfood}
spring.datasource.password=${DB_PASSWORD:fastfood}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true